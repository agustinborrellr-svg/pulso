name: Compilar Pulso (iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      capturas:
        description: "Sacar capturas de pantalla en el simulador"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Elegir Xcode (la versión estable más nueva)
        run: |
          XC=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi -e beta -e rc | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version | tee xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a xcode-version.txt

      - name: Generar el proyecto (XcodeGen)
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          zip -qry Pulso-xcodeproj.zip Pulso.xcodeproj

      - name: Tests del núcleo (protocolo + algoritmos)
        id: tests
        working-directory: Packages/PulsoKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../swift-test.log | tail -30

      - name: Compilar la app (sin firmar)
        id: build
        if: always()
        run: |
          set -o pipefail
          xcodebuild \
            -project Pulso.xcodeproj \
            -scheme Pulso \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | head -80
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Empaquetar Pulso.ipa
        id: package
        if: steps.build.outcome == 'success'
        run: |
          APP=build/Build/Products/Release-iphoneos/Pulso.app
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -d "$EXT" ] && codesign --force --sign - --entitlements Widgets/PulsoWidgets.entitlements "$EXT"
          done
          codesign --force --sign - --entitlements App/Resources/Pulso.entitlements "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Pulso.ipa Payload
          ls -la Pulso.ipa

      - name: Publicar en Releases (descarga directa)
        if: steps.package.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima Pulso.ipa \
            --title "Pulso (última versión)" \
            --notes "Compilado desde ${GITHUB_SHA::7}. Instálalo con Sideloadly (ver README)." \
            --latest

      - name: Guardar el proyecto generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodeproj
          path: Pulso-xcodeproj.zip
          retention-days: 7

      # Leaves a readable report on the `ci-status` branch so the build can be followed with plain git.
      - name: Informe en la rama ci-status
        if: always()
        run: |
          set +e
          mkdir -p /tmp/report
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tests=${{ steps.tests.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "package=${{ steps.package.outcome }}"
            [ -f Pulso.ipa ] && echo "ipa_bytes=$(stat -f%z Pulso.ipa)" && echo "ipa_sha256=$(shasum -a 256 Pulso.ipa | cut -d' ' -f1)"
          } > /tmp/report/status.txt
          cp xcode-version.txt /tmp/report/ 2>/dev/null
          [ -f swift-test.log ] && tail -400 swift-test.log > /tmp/report/swift-test.log
          if [ -f xcodebuild.log ]; then
            grep -E "error:|warning:.*\.swift|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | sort -u | head -400 > /tmp/report/xcodebuild-errors.txt
            tail -300 xcodebuild.log > /tmp/report/xcodebuild-tail.log
          fi
          cd /tmp/report
          git init -q -b ci-status
          git config user.name "pulso-ci"
          git config user.email "pulso-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI ${GITHUB_SHA::7}: build=${{ steps.build.outcome }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-status

  screenshots:
    # Only when asked: commit message with [capturas], or a manual run.
    if: contains(github.event.head_commit.message, '[capturas]') || (github.event_name == 'workflow_dispatch' && inputs.capturas)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Elegir Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi -e beta -e rc | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Generar el proyecto
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate

      - name: Compilar para el simulador
        run: |
          set -o pipefail
          xcodebuild -project Pulso.xcodeproj -scheme Pulso -configuration Release             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'             -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build > sim-build.log 2>&1 || (grep -E "error:" sim-build.log | head -40; exit 1)
          grep -q "BUILD SUCCEEDED" sim-build.log

      - name: Sacar capturas
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl ui "$UDID" appearance dark || true
          APP=build-sim/Build/Products/Release-iphonesimulator/Pulso.app
          BID=es.gusborrell.pulso
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # First launch builds three weeks of demo data; wait for the ready flag.
          xcrun simctl launch "$UDID" $BID -PulsoScreenshots YES -PulsoScreen today
          DATA=$(xcrun simctl get_app_container "$UDID" $BID data)
          for i in $(seq 1 180); do [ -f "$DATA/Documents/screenshots-ready" ] && break; sleep 2; done
          ls "$DATA/Documents" || true
          sleep 4
          n=1
          for S in today health recovery sleep strain stress trendRecovery trendStrain trendHRV device pairing trends live more; do
            xcrun simctl terminate "$UDID" $BID || true
            sleep 1
            xcrun simctl launch "$UDID" $BID -PulsoScreenshots YES -PulsoScreen $S -AppleLanguages "(es)" -AppleLocale es_ES
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$(printf %02d $n)-$S.png"
            n=$((n+1))
          done
          ls -la shots

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            shots/
            sim-build.log
          retention-days: 7

      - name: Publicar capturas en la rama ci-shots
        if: always()
        run: |
          set +e
          mkdir -p /tmp/shots && cp -R shots/. /tmp/shots/ 2>/dev/null
          cp sim-build.log /tmp/shots/ 2>/dev/null
          grep -E "error:" sim-build.log | sort -u > /tmp/shots/sim-errors.txt 2>/dev/null
          echo "commit=${GITHUB_SHA}" > /tmp/shots/status.txt
          cd /tmp/shots
          git init -q -b ci-shots
          git config user.name "pulso-ci"
          git config user.email "pulso-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots
