name: Pulso
options:
  bundleIdPrefix: es.gusborrell
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true

packages:
  PulsoKit:
    path: Packages/PulsoKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Pulso:
    type: application
    platform: iOS
    scheme: {}
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          - "Resources/Pulso.entitlements"
      - path: Shared
    dependencies:
      - target: PulsoWidgets
        embed: true
      - package: PulsoKit
        product: WhoopProtocol
      - package: PulsoKit
        product: PulsoStore
      - package: PulsoKit
        product: PulsoAnalytics
      - package: PulsoKit
        product: PulsoFeatures
      - package: PulsoKit
        product: PulsoIntegrations
      - package: PulsoKit
        product: PulsoECG
      - package: PulsoKit
        product: PulsoIntelligence
      - sdk: CoreBluetooth.framework
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSO_BUNDLE_ID)
        PULSO_BUNDLE_ID: es.gusborrell.pulso
        PRODUCT_NAME: Pulso
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Pulso.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO

  PulsoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "PulsoWidgets.entitlements"
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.gusborrell.pulso.widgets
        PRODUCT_NAME: PulsoWidgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/PulsoWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
